<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amazon Power Search</title>
<link rel="stylesheet" href="results.css">
</head>
<body>
<header>
  <h1>Amazon Power Search</h1>
  <form id="scan-form">
    <input id="q" placeholder="Search Amazon" required>
    <select id="domain"></select>
    <label>Max requests <input id="budget" type="number" value="150" min="10" max="2000"></label>
    <label>Delay (ms) <input id="delay" type="number" value="2200" min="1000" step="100"></label>
    <button id="start" type="submit">Scan</button>
    <button id="stop" type="button" disabled>Stop</button>
  </form>
  <div id="banner" hidden></div>
  <div id="status"></div>
  <progress id="progress" max="1" value="0" hidden></progress>
</header>

<section id="filters">
  <label>Include words <input id="f-include" placeholder="e.g. braided 2m"></label>
  <label>Exclude words <input id="f-exclude" placeholder="e.g. adapter case"></label>
  <label>Price <input id="f-min" type="number" step="any" placeholder="min"> – <input id="f-max" type="number" step="any" placeholder="max"></label>
  <label>Min rating <input id="f-rating" type="number" step="0.1" min="0" max="5"></label>
  <label>Min reviews <input id="f-reviews" type="number" min="0"></label>
  <label><input id="f-sponsored" type="checkbox" checked> Hide sponsored</label>
  <label><input id="f-noprice" type="checkbox" checked> Hide no price</label>
  <label><input id="f-prime" type="checkbox"> Prime only</label>
  <label><input id="f-free" type="checkbox"> Free delivery</label>
</section>

<section id="viewbar">
  <div class="seg" role="group" aria-label="View">
    <button type="button" id="v-list" data-view="list">List</button>
    <button type="button" id="v-grid" data-view="grid">Grid</button>
  </div>
  <label class="slider">Image size <input id="size" type="range"> <output id="size-out"></output></label>
  <label>Sort
    <select id="sort">
      <option value="price">Price</option>
      <option value="unit">Unit price</option>
      <option value="value">Value (rating per dollar)</option>
      <option value="rating">Rating (adjusted for review count)</option>
      <option value="reviews">Reviews</option>
      <option value="bought">Bought last month</option>
      <option value="delivery">Delivery cost</option>
      <option value="brand">Brand</option>
      <option value="title">Title</option>
    </select>
  </label>
  <button id="dir" type="button" title="Reverse the sort order"></button>
  <button id="csv" type="button">Export CSV</button>
  <span id="count"></span>
</section>

<div id="grid" hidden></div>
<table id="results">
  <thead><tr>
    <th class="img"></th>
    <th data-sort="title">Product</th>
    <th data-sort="brand">Brand</th>
    <th class="num" data-sort="price">Price</th>
    <th class="num" data-sort="unit" title="Price per 100 g / 100 ml / unit">Unit</th>
    <th class="num" data-sort="rating" title="Rating adjusted for how many reviews it has">Rating</th>
    <th class="num" data-sort="reviews">Reviews</th>
    <th class="num" data-sort="bought">Bought</th>
    <th data-sort="delivery" title="Sorted by delivery cost">Delivery</th>
    <th class="num" data-sort="value" title="Adjusted rating per dollar">Value</th>
  </tr></thead>
  <tbody></tbody>
</table>
<button id="more" hidden>Show more</button>
<script type="module" src="results.js"></script>
</body>
</html>
